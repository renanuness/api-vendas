name: Build Fornecedores Service

on:
  push:
    branches:
      - '**'   # qualquer branch
  # opcional: permite rodar manualmente pela aba Actions
  workflow_dispatch:

jobs:
  build:
    name: Compilar fornecedores-service com Maven
    runs-on: ubuntu-latest

    steps:
      # 1) Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2) Instala o Java 17 (Temurin) com cache do Maven
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3) Compila o fornecedores-service com Maven
      - name: Compilar com Maven
        working-directory: ./fornecedores-service
        run: mvn -B clean compile